[package]
name = "zksync_airbender_verifier"
description = "ZKsync library for Airbender verification"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["circuit_tracer"]
# Forwards to `zksync_multivm/circuit_tracer`. Enabled by default; the guest
# (proving) build sets `default-features = false` to compile out the
# sequencer-only circuit tracer the verifier never reads.
circuit_tracer = ["zksync_multivm/circuit_tracer"]
# Benchmarking only — see docs/benchmarking.md. Neither may ship in a proved guest.
#
# `cycle-markers` emits verify() phase boundaries as `csrrw x0, 0x7ff, x0`, which
# scripts/check_guest_riscv_code.sh rejects (CI, incl. release-artifacts).
cycle-markers = ["dep:airbender"]
# `relax-version-pin` drops the protocol-version pin so the calibration harness can
# measure older-but-still-FastVM-supported batches. It leaves no trace in the guest
# binary, so lib.rs requires `cycle-markers` alongside it to keep it CI-detectable.
relax-version-pin = ["cycle-markers"]
# `mem-markers` exposes the heap-probe counters and reports live/peak at each
# verify() phase boundary. Purely observational and host-only — every tool that
# drives it runs natively, so unlike the two flags above it never affects a proved
# guest. Still default-off: it adds stderr output and a public module.
mem-markers = []

[dependencies]
# Only pulled in under `cycle-markers` (calibration guest build).
airbender = { workspace = true, optional = true }
zksync_crypto_primitives.workspace = true
zksync_merkle_tree = { workspace = true, default-features = false }
# Explicit path dep (not `workspace = true`) so `default-features = false` is
# honored — Cargo ignores that override on workspace-inherited deps. Disabling
# it lets this crate's own `circuit_tracer` feature control multivm's, so the
# guest build (which turns this crate's feature off) compiles out the tracer.
zksync_multivm = { path = "../multivm", default-features = false }
zksync_system_constants.workspace = true
zksync_types.workspace = true
zksync_vm_interface.workspace = true

anyhow.workspace = true
ark-ff.workspace = true
ark-bls12-381.workspace = true
serde.workspace = true
tracing.workspace = true

[dev-dependencies]
airbender-codec.workspace = true
zksync_cli_utils.workspace = true
zksync_contracts.workspace = true

bincode.workspace = true

serde_json.workspace = true
# `talc_timeline` runs the verifier under the guest's own allocator, natively.
# `counters` is what exposes the claimed/available footprint the tool reports.
talc = { version = "4.4.3", default-features = false, features = ["lock_api", "counters"] }

# The heap benchmarking examples all need the probe counters compiled in.
[[example]]
name = "mem_check"
required-features = ["mem-markers"]

[[example]]
name = "mem_timeline"
required-features = ["mem-markers"]

[[example]]
name = "talc_timeline"
required-features = ["mem-markers"]
